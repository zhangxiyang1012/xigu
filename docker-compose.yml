services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: xigu
      POSTGRES_USER: xigu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xigu_local_change_me}
    volumes:
      - xigu_postgres:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xigu -d xigu"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./local-api
    environment:
      DATABASE_URL: postgresql://xigu:${POSTGRES_PASSWORD:-xigu_local_change_me}@postgres:5432/xigu
      CORS_ORIGINS: http://localhost:3000
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.local
      args: { NEXT_PUBLIC_API_BASE: http://localhost:8000 }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  xigu_postgres:
